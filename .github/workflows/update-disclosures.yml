name: 適時開示データ更新
run-name: ${{ github.event_name == 'schedule' && '定期実行（schedule）' || '手動実行（workflow_dispatch）' }}

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-tdnet-disclosures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 実行契機を記録
        run: |
          echo "event=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "scheduled_at=${{ github.event.schedule || 'manual' }}"
      - name: ファイルを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TDnetを確認
        run: python scripts/fetch_tdnet.py
      - name: JSONの変更を保存
        run: |
          if git diff --quiet -- docs/data; then
            echo "保存する変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/disclosures.json docs/data/status.json
          git commit -m "data: update TDnet disclosures"
          git push
      - name: Pages用ファイルを準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ反映
        id: deployment
        uses: actions/deploy-pages@v4
