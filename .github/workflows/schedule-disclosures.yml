name: 適時開示データ定期更新
run-name: 開示データ更新（${{ github.event_name }}）

on:
  workflow_dispatch:
  schedule:
    # スケジュール起動の検証中は5分ごとに実行する。
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  trigger-info:
    runs-on: ubuntu-latest
    steps:
      - name: 実行契機を記録
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"

  update:
    needs: trigger-info
    uses: ./.github/workflows/update-disclosures.yml
