name: 適時開示データ定期更新
run-name: 定期実行（${{ github.event.schedule }}）

# Scheduled events are registered by workflow file identity.  Keep the cron-only
# entry point separate from the manually dispatched worker so that replacing this
# file forces GitHub to create a fresh scheduler registration.
on:
  schedule:
    # GitHub Actionsの時刻はUTC（以下は日本時間の平日 9:07 / 12:07 / 15:37 / 17:37）。
    - cron: "7 0 * * 1-5"
    - cron: "7 3 * * 1-5"
    - cron: "37 6 * * 1-5"
    - cron: "37 8 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    uses: ./.github/workflows/update-disclosures.yml
