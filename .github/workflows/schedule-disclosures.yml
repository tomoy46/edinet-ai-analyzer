name: 適時開示データ定期更新
run-name: 開示データ更新（${{ inputs.request_id || github.event_name }}）

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 中継APIが実行結果を識別するためのID
        required: false
        type: string
  schedule:
  - cron: "7 0 * * 1-5"
  - cron: "7 3 * * 1-5"
  - cron: "37 6 * * 1-5"
  - cron: "37 8 * * 1-5"
  
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  trigger-info:
    runs-on: ubuntu-latest
    steps:
      - name: 実行契機を記録
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"

  update:
    needs: trigger-info
    uses: ./.github/workflows/update-disclosures.yml
    secrets: inherit
